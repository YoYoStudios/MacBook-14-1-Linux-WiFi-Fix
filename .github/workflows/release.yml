name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - app.py
      - install.sh
      - uninstall.sh
      - src/**
      - distros/**
      - bootloaders/**
      - windows/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone source
        shell: bash
        run: |
          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$GITHUB_SHA"
      - name: Read version and create draft release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < repo/VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; assets will be replaced."
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$VERSION - Universal MacBook Wi-Fi Fix" \
              --generate-notes \
              --draft
          fi

  distro-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Clone source
        shell: bash
        run: |
          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$GITHUB_SHA"
      - name: Syntax-check scripts on distro containers
        shell: bash
        run: |
          set -e
          files="install.sh uninstall.sh src/macbook-wifi-fix src/macbook-wifi-fix.openrc src/install-firmware-packages distros/arch.sh distros/fedora.sh distros/ubuntu.sh distros/debian.sh"
          for image in ubuntu:24.04 debian:bookworm fedora:latest archlinux:latest; do
            echo "== $image =="
            docker run --rm -v "$PWD/repo:/repo:ro" "$image" bash -lc "for f in $files; do bash -n /repo/\$f; done"
          done

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: MacBook-WiFi-Fix-Linux-x86_64
            kind: linux
            python: python3
          - runner: ubuntu-24.04-arm
            asset: MacBook-WiFi-Fix-Linux-arm64
            kind: linux
            python: python3
          - runner: windows-latest
            asset: MacBook-WiFi-Fix-Windows-x64.exe
            kind: windows
            python: python
          - runner: macos-15-intel
            asset: MacBook-WiFi-Fix-macOS-Intel.zip
            kind: mac
            python: python3
          - runner: macos-15
            asset: MacBook-WiFi-Fix-macOS-AppleSilicon.zip
            kind: mac
            python: python3
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Clone source
        shell: bash
        run: |
          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$GITHUB_SHA"

      - name: Install Linux GUI libraries
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Ensure macOS Tk support
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          if ! ${{ matrix.python }} -c 'import tkinter' >/dev/null 2>&1; then
            brew install python-tk@3.13
          fi

      - name: Install PyInstaller and compile-check
        shell: bash
        working-directory: repo
        run: |
          ${{ matrix.python }} -m pip install --user --upgrade pip "pyinstaller>=6.16,<7"
          ${{ matrix.python }} -m py_compile app.py

      - name: Build GUI
        shell: bash
        working-directory: repo
        run: ${{ matrix.python }} -m PyInstaller --noconfirm --clean --onefile --windowed --name MacBook-WiFi-Fix app.py

      - name: Prepare Linux asset
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          cp repo/dist/MacBook-WiFi-Fix "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Prepare Windows asset
        if: matrix.kind == 'windows'
        shell: pwsh
        run: Copy-Item "repo\dist\MacBook-WiFi-Fix.exe" "${{ matrix.asset }}"

      - name: Prepare macOS asset
        if: matrix.kind == 'mac'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "repo/dist/MacBook-WiFi-Fix.app" "${{ matrix.asset }}"

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: gh release upload "$VERSION" "${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"

  portable:
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        shell: bash
        run: |
          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$GITHUB_SHA"
      - name: Build portable bundle
        shell: bash
        run: |
          set -e
          root="MacBook-WiFi-Fix-Portable"
          mkdir -p "$root/src" "$root/windows" "$root/distros" "$root/bootloaders"
          cp repo/install.sh repo/uninstall.sh "$root/"
          cp repo/src/macbook-wifi-fix repo/src/macbook-wifi-fix.service repo/src/macbook-wifi-fix.openrc repo/src/install-firmware-packages "$root/src/"
          cp repo/windows/*.ps1 repo/windows/README.md "$root/windows/"
          cp repo/distros/*.sh "$root/distros/"
          cp repo/bootloaders/*.sh "$root/bootloaders/"
          cp repo/README.md "$root/"
          zip -r MacBook-WiFi-Fix-Portable.zip "$root"
      - name: Upload portable bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: gh release upload "$VERSION" MacBook-WiFi-Fix-Portable.zip --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs:
      - prepare-release
      - build
      - portable
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: gh release edit "$VERSION" --draft=false --repo "$GITHUB_REPOSITORY"

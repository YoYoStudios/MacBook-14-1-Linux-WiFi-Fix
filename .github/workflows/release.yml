name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - app.py
      - install.sh
      - uninstall.sh
      - src/**
      - windows/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  distro-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check Linux scripts on distro containers
        shell: bash
        run: |
          set -e
          files="install.sh uninstall.sh src/macbookpro14-1-wifi-fix src/macbookpro14-1-wifi-fix.openrc distros/arch.sh distros/fedora.sh distros/ubuntu.sh distros/debian.sh"
          for image in ubuntu:24.04 debian:bookworm fedora:latest archlinux:latest; do
            echo "== $image =="
            docker run --rm -v "$PWD:/repo:ro" "$image" bash -lc "for f in $files; do bash -n /repo/\$f; done"
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: linux-x64
            asset: MacBook-WiFi-Fix-Linux-x86_64
            kind: linux
          - runner: ubuntu-24.04-arm
            artifact: linux-arm64
            asset: MacBook-WiFi-Fix-Linux-arm64
            kind: linux
          - runner: windows-latest
            artifact: windows-x64
            asset: MacBook-WiFi-Fix-Windows-x64.exe
            kind: windows
          - runner: macos-15-intel
            artifact: macos-intel
            asset: MacBook-WiFi-Fix-macOS-Intel.zip
            kind: mac
          - runner: macos-15
            artifact: macos-arm64
            asset: MacBook-WiFi-Fix-macOS-AppleSilicon.zip
            kind: mac
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      - name: Install build tools
        run: python -m pip install --upgrade pip "pyinstaller>=6.15,<7"

      - name: Compile check
        run: python -m py_compile app.py

      - name: Build GUI
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MacBook-WiFi-Fix app.py

      - name: Prepare Linux asset
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          cp dist/MacBook-WiFi-Fix "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Prepare Windows asset
        if: matrix.kind == 'windows'
        shell: pwsh
        run: Copy-Item "dist\MacBook-WiFi-Fix.exe" "${{ matrix.asset }}"

      - name: Prepare macOS asset
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/MacBook-WiFi-Fix.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable bundle
        shell: bash
        run: |
          set -e
          root="MacBook-WiFi-Fix-Portable"
          mkdir -p "$root/src" "$root/windows" "$root/distros" "$root/bootloaders"
          cp install.sh uninstall.sh "$root/"
          cp src/macbookpro14-1-wifi-fix src/macbookpro14-1-wifi-fix.service src/macbookpro14-1-wifi-fix.openrc "$root/src/"
          cp windows/*.ps1 "$root/windows/"
          cp distros/*.sh "$root/distros/"
          cp bootloaders/*.sh "$root/bootloaders/"
          cp README.md "$root/"
          zip -r MacBook-WiFi-Fix-Portable.zip "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: release-portable
          path: MacBook-WiFi-Fix-Portable.zip

  release:
    needs:
      - build
      - portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f -print | sort)

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No release assets found."
            exit 1
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${FILES[@]}" --clobber
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "$VERSION - Cross-platform GUI" \
              --generate-notes \
              "${FILES[@]}"

name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - VERSION

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile app.py
      - name: Shell syntax
        shell: bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n src/macbook-wifi-fix
          bash -n src/macbook-wifi-fix.openrc
          bash -n src/install-firmware-packages
          for f in distros/*.sh bootloaders/*.sh; do bash -n "$f"; done

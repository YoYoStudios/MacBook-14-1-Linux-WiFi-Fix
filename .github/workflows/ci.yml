name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - VERSION

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        shell: bash
        run: |
          git clone --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "$GITHUB_SHA"
      - name: Python syntax
        shell: bash
        run: python3 -m py_compile repo/app.py
      - name: Shell syntax
        shell: bash
        run: |
          set -e
          bash -n repo/install.sh
          bash -n repo/uninstall.sh
          bash -n repo/src/macbook-wifi-fix
          bash -n repo/src/macbook-wifi-fix.openrc
          bash -n repo/src/install-firmware-packages
          for f in repo/distros/*.sh repo/bootloaders/*.sh; do bash -n "$f"; done
